<!DOCTYPE html>
<html>
<head>
  <title>Phone Photobooth</title>
  <style>
    body { text-align: center; font-family: sans-serif; background: #f7f0e8; }
    h1 { font-size: 24px; margin-bottom: 10px; }
    video, canvas { width: 90%; max-width: 350px; border: 5px solid black; margin: 10px 0; }
    button { padding: 10px 20px; font-size: 18px; margin: 10px; cursor: pointer; }
    .filter-vintage { filter: sepia(0.5) contrast(1.2) brightness(1.1); }
  </style>
</head>
<body>
  <h1>📸 My Free Photobooth</h1>
  <video id="video" autoplay playsinline class="filter-vintage"></video>
  <br>
  <button onclick="countdown()">Take Photo</button>
  <div id="countdown" style="font-size:30px; font-weight:bold;"></div>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const countdownEl = document.getElementById('countdown');

    // Ask for camera
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; });

    // Countdown + snap
    function countdown() {
      let i = 3;
      countdownEl.innerText = i;
      let timer = setInterval(() => {
        i--;
        if (i > 0) {
          countdownEl.innerText = i;
        } else {
          clearInterval(timer);
          countdownEl.innerText = "";
          takePhoto();
        }
      }, 1000);
    }

    function takePhoto() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
    }
  </script>
</body>
</html>
